<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 796" width="1360" height="796" font-family="Helvetica, Arial, sans-serif"><title>A vida de um dado pessoal · cliente 5</title><defs><marker id="seta-lote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="seta-fluxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="seta-desvio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="seta-regra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="seta-copia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="32" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Do dado à proteção · visão de fluxo: a vida de um dado pessoal (cliente 5)</text><text x="30" y="52" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Do cadastro à eliminação, morada por morada. Cor = forma do dado naquela morada, naquele momento.</text><text x="385.0" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dia 1 · cadastro</text><text x="655.0" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dia 2 · exclusão no CDC</text><text x="925.0" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Missão 8 · esquecer 5</text><text x="1195.0" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Missão 9 · restauração</text><text x="30" y="138.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Origem · cadastro</text><rect x="254" y="106" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="264" y="126" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">nome, e-mail, CPF, nascimento, cidade</text><text x="264" y="141" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(real)</text><rect x="524" y="106" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="534" y="126" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">DELETE: sai da origem</text><rect x="794" y="106" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="126" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">ausente</text><rect x="1064" y="106" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="126" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">ausente</text><text x="30" y="202.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Origem · recado do pedido 106</text><rect x="254" y="170" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="264" y="190" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">telefone no texto livre (real)</text><rect x="524" y="170" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="534" y="190" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">telefone (real)</text><rect x="794" y="170" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="190" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">campo limpo; o pedido fica</text><rect x="1064" y="170" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="190" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">campo limpo</text><text x="30" y="266.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Origem · navegação</text><rect x="254" y="234" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="264" y="254" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">2 eventos com o IP (real)</text><rect x="524" y="234" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="534" y="254" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">2 eventos (real)</text><rect x="794" y="234" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="254" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">eventos apagados</text><rect x="1064" y="234" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="254" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">sem os eventos</text><text x="30" y="330.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Log de mudanças</text><rect x="254" y="298" width="258" height="56" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="264" y="318" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">captura desligada ainda</text><rect x="524" y="298" width="258" height="56" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="534" y="318" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">exclusão registrada só com a chave</text><rect x="794" y="298" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="318" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">carga útil zerada</text><rect x="1064" y="298" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="318" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reaplicado: nada dela</text><text x="30" y="394.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Tópico navegacao</text><rect x="254" y="362" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="264" y="382" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">eventos com IP (real)</text><rect x="524" y="362" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="534" y="382" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">eventos com IP (real)</text><rect x="794" y="362" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="382" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">lápide + compactação</text><rect x="1064" y="362" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="382" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">lápide relida</text><text x="30" y="458.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Estado dos leitores</text><rect x="254" y="426" width="258" height="56" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="264" y="446" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">contagens por página e por cliente</text><rect x="524" y="426" width="258" height="56" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="534" y="446" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">contagens</text><rect x="794" y="426" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="446" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">eventos dela removidos</text><rect x="1064" y="426" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="446" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reconstruído do log</text><text x="30" y="522.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Bronze</text><rect x="254" y="490" width="258" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="264" y="510" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">cadastro cifrado (chave dela)</text><rect x="524" y="490" width="258" height="56" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.5"/><text x="534" y="510" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">DELETE propagado; resto real</text><rect x="794" y="490" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="510" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">tudo tratado; chave apagada</text><rect x="1064" y="490" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="510" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">cópia traz tudo; lista reaplicada</text><text x="30" y="586.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Silver e gold</text><rect x="254" y="554" width="258" height="56" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><text x="264" y="574" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">pseudônimo (HMAC)</text><rect x="524" y="554" width="258" height="56" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><text x="534" y="574" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">pseudônimo; pedido 106 sem cadastro</text><rect x="794" y="554" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="574" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reconstruída; cliente_ps vazio</text><rect x="1064" y="554" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="574" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reconstruída da bronze</text><text x="30" y="650.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Cópia de segurança do dia 1</text><rect x="254" y="618" width="258" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="264" y="638" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">cadastro cifrado + IP/telefone reais</text><rect x="524" y="618" width="258" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="534" y="638" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">idem (cópia é fotografia)</text><rect x="794" y="618" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="804" y="638" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">expira; sem a chave, o cadastro é</text><text x="804" y="653" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">ruído</text><rect x="1064" y="618" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="1074" y="638" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">restaurada → lista de eliminação</text><text x="1074" y="653" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reaplicada</text><rect x="30" y="700" width="16" height="16" rx="3" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.6"/><text x="52" y="713" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">dado real</text><rect x="143" y="700" width="16" height="16" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/><text x="165" y="713" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">cifrado com a chave do titular</text><rect x="403" y="700" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><text x="425" y="713" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">pseudônimo</text><rect x="523" y="700" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="545" y="713" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">sem dado pessoal ou só metadado</text><rect x="790" y="700" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="812" y="713" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">ausente / eliminado</text><text x="30" y="744" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Pedido 106: continua (nota fiscal, LGPD art. 16, I), sem pessoa. A receita não muda. Pseudônimo não é anônimo: por isso a silver não tem CPF, nome, e-mail, IP nem observação.</text></svg>
