<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 740" width="1380" height="740" font-family="Helvetica, Arial, sans-serif"><title>Loja online · estrutura do pipeline (do dado à proteção)</title><defs><marker id="seta-lote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="seta-fluxo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="seta-desvio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="seta-regra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="seta-copia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="32" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Do dado à proteção · visão de estrutura</text><text x="30" y="52" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Cifra em trânsito e em repouso em todas as setas e camadas (o piso universal). Quem acessa: pipeline = lê e escreve · analista = só lê silver e gold.</text><rect x="30" y="84" width="210" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="46" y="104" font-weight="700" font-size="14">lista de eliminação</text><text x="46" y="122" font-size="11.5" fill="#334155">esquecer: vale em toda morada</text><rect x="480" y="84" width="180" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="496" y="104" font-weight="700" font-size="14">acordo de governança</text><text x="496" y="122" font-size="11.5" fill="#334155">dono · classe · retenção</text><rect x="730" y="84" width="170" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="746" y="104" font-weight="700" font-size="14">contratos</text><text x="746" y="122" font-size="11.5" fill="#334155">campos · regras · classe</text><rect x="940" y="84" width="190" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="956" y="104" font-weight="700" font-size="14">CHAVE_PSEUDONIMO</text><text x="956" y="122" font-size="11.5" fill="#334155">ambiente · fora do código</text><rect x="250" y="150" width="220" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="266" y="170" font-weight="700" font-size="14">cofre de chaves por titular</text><text x="266" y="188" font-size="11.5" fill="#334155">AES-GCM · apagar = esquecer</text><rect x="30" y="240" width="215" height="100" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.6"/><rect x="30" y="240" width="6" height="100" rx="3" fill="#b3261e"/><text x="46" y="260" font-weight="700" font-size="14">Origem</text><text x="46" y="278" font-size="11.5" fill="#334155">banco da loja · classe: pessoal</text><text x="46" y="293" font-size="11.5" fill="#334155">clientes · pedidos · navegacao</text><text x="46" y="308" font-size="11.5" fill="#334155">acesso: aplicação da loja</text><rect x="480" y="240" width="170" height="110" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/><rect x="480" y="240" width="6" height="110" rx="3" fill="#b45309"/><text x="496" y="260" font-weight="700" font-size="14">Bronze</text><text x="496" y="278" font-size="11.5" fill="#334155">cópia fiel · classe: pessoal</text><text x="496" y="293" font-size="11.5" fill="#334155">cadastro cifrado por titular</text><text x="496" y="308" font-size="11.5" fill="#334155">acesso: só o pipeline</text><rect x="730" y="240" width="140" height="100" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><rect x="730" y="240" width="6" height="100" rx="3" fill="#475569"/><text x="746" y="260" font-weight="700" font-size="14">Validação</text><text x="746" y="278" font-size="11.5" fill="#334155">aplica o contrato</text><text x="746" y="293" font-size="11.5" fill="#334155">linha a linha</text><rect x="940" y="240" width="200" height="110" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><rect x="940" y="240" width="6" height="110" rx="3" fill="#6d28d9"/><text x="956" y="260" font-weight="700" font-size="14">Silver</text><text x="956" y="278" font-size="11.5" fill="#334155">validada · protegida</text><text x="956" y="293" font-size="11.5" fill="#334155">pseudônimo HMAC · sem CPF/IP</text><text x="956" y="308" font-size="11.5" fill="#334155">acesso: analista (leitura)</text><rect x="1190" y="240" width="170" height="110" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><rect x="1190" y="240" width="6" height="110" rx="3" fill="#047857"/><text x="1206" y="260" font-weight="700" font-size="14">Gold</text><text x="1206" y="278" font-size="11.5" fill="#334155">receita_por_cidade</text><text x="1206" y="293" font-size="11.5" fill="#334155">agregado · K ≥ 2</text><text x="1206" y="308" font-size="11.5" fill="#334155">acesso: analista (leitura)</text><rect x="730" y="410" width="140" height="70" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.6"/><rect x="730" y="410" width="6" height="70" rx="3" fill="#b3261e"/><text x="746" y="430" font-weight="700" font-size="14">Quarentena</text><text x="746" y="448" font-size="11.5" fill="#334155">linha + motivo</text><text x="746" y="463" font-size="11.5" fill="#334155">classe: pessoal</text><rect x="250" y="400" width="190" height="70" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.6"/><rect x="250" y="400" width="6" height="70" rx="3" fill="#b3261e"/><text x="266" y="420" font-weight="700" font-size="14">Log de mudanças (CDC)</text><text x="266" y="438" font-size="11.5" fill="#334155">gatilhos · só anexa · offset</text><text x="266" y="453" font-size="11.5" fill="#334155">classe: pessoal · retenção curta</text><rect x="250" y="520" width="190" height="70" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.6"/><rect x="250" y="520" width="6" height="70" rx="3" fill="#b3261e"/><text x="266" y="540" font-weight="700" font-size="14">Tópico navegacao</text><text x="266" y="558" font-size="11.5" fill="#334155">só anexa · guarda por tempo</text><text x="266" y="573" font-size="11.5" fill="#334155">lápide + compactação (LGPD)</text><rect x="480" y="520" width="190" height="70" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><rect x="480" y="520" width="6" height="70" rx="3" fill="#475569"/><text x="496" y="540" font-weight="700" font-size="14">Leitores (offset próprio)</text><text x="496" y="558" font-size="11.5" fill="#334155">visitas · por_cliente · bronze</text><text x="496" y="573" font-size="11.5" fill="#334155">idempotentes · pelo menos uma vez</text><rect x="940" y="420" width="170" height="70" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><rect x="940" y="420" width="6" height="70" rx="3" fill="#475569"/><text x="956" y="440" font-weight="700" font-size="14">Cópia de segurança</text><text x="956" y="458" font-size="11.5" fill="#334155">bronze + offsets + manifesto</text><text x="956" y="473" font-size="11.5" fill="#334155">outra pasta · SHA-256</text><rect x="1180" y="420" width="170" height="70" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><rect x="1180" y="420" width="6" height="70" rx="3" fill="#475569"/><text x="1196" y="440" font-weight="700" font-size="14">Cópia isolada</text><text x="1196" y="458" font-size="11.5" fill="#334155">imutável · credencial</text><text x="1196" y="473" font-size="11.5" fill="#334155">independente · 3-2-1-1-0</text><rect x="1180" y="530" width="190" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="1196" y="550" font-weight="700" font-size="14">cópia da chave</text><text x="1196" y="568" font-size="11.5" fill="#334155">fora do ambiente da produção</text><path d="M245,290 L480,290" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#seta-lote)"/><text x="258" y="280" font-size="11" fill="#475569" font-style="italic">carga incremental · marca-d'água</text><path d="M130,340 L130,435 L250,435" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#seta-fluxo)"/><text x="138" y="400" font-size="11" fill="#475569" font-style="italic">captura de mudanças</text><path d="M440,435 L540,435 L540,350" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#seta-fluxo)"/><text x="548" y="405" font-size="11" fill="#475569" font-style="italic">em ordem</text><path d="M70,340 L70,555 L250,555" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#seta-fluxo)"/><text x="78" y="540" font-size="11" fill="#475569" font-style="italic">cliques</text><path d="M440,555 L480,555" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#seta-fluxo)"/><path d="M600,520 L600,350" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="9 5" marker-end="url(#seta-fluxo)"/><path d="M650,290 L730,290" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#seta-lote)"/><path d="M870,290 L940,290" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#seta-lote)"/><path d="M1140,290 L1190,290" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#seta-lote)"/><path d="M800,340 L800,410" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#seta-desvio)"/><text x="808" y="380" font-size="11" fill="#475569" font-style="italic">reprovada</text><path d="M660,112 L730,112" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#seta-regra)"/><path d="M800,140 L800,240" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#seta-regra)"/><text x="808" y="190" font-size="11" fill="#475569" font-style="italic">contrato</text><path d="M1040,140 L1040,240" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#seta-regra)"/><text x="1048" y="190" font-size="11" fill="#475569" font-style="italic">pseudônimo</text><path d="M470,179 L500,179 L500,240" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#seta-regra)"/><path d="M135,140 L135,240" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#seta-regra)"/><text x="143" y="190" font-size="11" fill="#475569" font-style="italic">elimina</text><path d="M630,350 L630,505 L1025,505 L1025,490" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="14 4 2 4" marker-end="url(#seta-copia)"/><text x="700" y="498" font-size="11" fill="#475569" font-style="italic">cópia diária</text><path d="M1110,455 L1180,455" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="14 4 2 4" marker-end="url(#seta-copia)"/><path d="M1265,490 L1265,530" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="14 4 2 4" marker-end="url(#seta-copia)"/><text x="30" y="650" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Legenda</text><path d="M30,670 L76,670" fill="none" stroke="#1e293b" stroke-width="2.4"/><text x="84" y="674" font-size="11" font-weight="400" fill="#334155" text-anchor="start">carga em lote (traço cheio)</text><path d="M270,670 L316,670" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="9 5"/><text x="324" y="674" font-size="11" font-weight="400" fill="#334155" text-anchor="start">captura de mudanças e fluxo de eventos (tracejado)</text><path d="M648,670 L694,670" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="2 5"/><text x="702" y="674" font-size="11" font-weight="400" fill="#334155" text-anchor="start">desvio: o que não passou (pontilhado)</text><path d="M948,670 L994,670" fill="none" stroke="#94a3b8" stroke-width="1.4"/><text x="1002" y="674" font-size="11" font-weight="400" fill="#334155" text-anchor="start">contrato, regra e chave (fino)</text><path d="M1206,670 L1252,670" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="14 4 2 4"/><text x="1260" y="674" font-size="11" font-weight="400" fill="#334155" text-anchor="start">cópia de segurança</text><rect x="30" y="694" width="16" height="16" rx="3" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.6"/><text x="52" y="707" font-size="11" font-weight="400" fill="#334155" text-anchor="start">classe: pessoal</text><rect x="180" y="694" width="16" height="16" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/><text x="202" y="707" font-size="11" font-weight="400" fill="#334155" text-anchor="start">classe: pessoal cifrado</text><rect x="330" y="694" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><text x="352" y="707" font-size="11" font-weight="400" fill="#334155" text-anchor="start">classe: pseudonimizado</text><rect x="480" y="694" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="502" y="707" font-size="11" font-weight="400" fill="#334155" text-anchor="start">classe: agregado</text><rect x="630" y="694" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="652" y="707" font-size="11" font-weight="400" fill="#334155" text-anchor="start">classe: interno</text></svg>
